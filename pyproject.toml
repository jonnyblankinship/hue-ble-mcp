[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hue-ble-mcp"
version = "0.1.2"
description = "MCP server to control Philips Hue lights via Bluetooth LE — no bridge required"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonny Blankinship", email = "jonny.blankinship@gmail.com" }]
keywords = ["mcp", "philips-hue", "bluetooth", "ble", "smart-home", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "bleak>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/jonnyblankinship/hue-ble-mcp"
Repository = "https://github.com/jonnyblankinship/hue-ble-mcp"
Issues = "https://github.com/jonnyblankinship/hue-ble-mcp/issues"

[project.scripts]
hue-ble-mcp = "hue_ble_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hue_ble_mcp"]
